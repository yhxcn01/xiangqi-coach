[package]
name = "xiangqi-coach"
version = "0.1.0"
edition = "2021"
description = "象棋思考教练 — 引擎是大脑，AI 是嘴"

[dependencies]
xqcore = { path = "../core" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs"] }
reqwest = { version = "0.12", features = ["json"] }
